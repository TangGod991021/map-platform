[project]
name = "map-platform-api"
version = "0.1.0"
description = "黔山漫游 · 管理后端（FastAPI + SQLAlchemy）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
mysql = ["asyncmy>=0.2.9"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I001", "UP"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
