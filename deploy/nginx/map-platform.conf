# 黔山漫游（map-platform）· Nginx 示例
# 合并到现有 /etc/nginx/nginx.conf 或 conf.d/；证书路径按实际修改。

# ===================== 管理后台 map-admin.mengyu.live =====================
server {
    listen 80;
    server_name map-admin.mengyu.live;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name map-admin.mengyu.live;

    ssl_certificate     /etc/letsencrypt/live/map-admin.mengyu.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/map-admin.mengyu.live/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 25m;

    root /data/map-platform/apps/admin-web/dist;
    index index.html;

    location /prod-api/ {
        proxy_pass http://127.0.0.1:11000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /profile/ {
        proxy_pass http://127.0.0.1:11000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ===================== 地图 H5 tianmap.mengyu.live =====================
server {
    listen 80;
    server_name tianmap.mengyu.live;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name tianmap.mengyu.live;

    ssl_certificate     /etc/letsencrypt/live/tianmap.mengyu.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tianmap.mengyu.live/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /data/map-platform/apps/map-web;
    index index.html;

    # 发布快照：不缓存，保证后台发布后立即生效
    location = /data/map.json {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location = /data/manifest.json {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location /data/ {
        try_files $uri =404;
    }

    # 可选：公开只读 API（优先使用静态快照，可不开放）
    location /map-api/ {
        proxy_pass http://127.0.0.1:11000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
